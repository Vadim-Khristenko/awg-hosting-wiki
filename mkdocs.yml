site_name: Amnezia Hosting Docs
site_url: https://github.io

theme:
  name: material
  language: ru
  logo: assets/logo.png
  favicon: images/favicon.png
  font:
    text: Inter
    code: Roboto Mono
    palette:
    - scheme: amnezia-dark
      primary: custom
      accent: custom


extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          default: false
          build: true


markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences
  - admonition
