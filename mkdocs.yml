site_name: Amnezia Hosting Docs
site_url: https://bumbumshakataka1.github.io/hosting-docs/

# Ссылка на ваш GitHub репозиторий (добавит иконку со звездами в шапку сайта)
repo_name: bumbumshakataka1/hosting-docs
repo_url: https://bumbumshakataka1.github.io/hosting-docs/

theme:
  name: material
  language: ru
  logo: assets/logo.png
  favicon: images/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - scheme: amnezia-dark
      primary: custom
      accent: custom
  features:
    - navigation.top        # Кнопка «Наверх» (появляется внизу при скролле)
    - navigation.tracking   # Обновляет URL в строке браузера при скролле до заголовков
    - navigation.footer      # Показывает кнопки навигации (Назад / Вперед)
    - navigation.footer.text # Обязательно! Разрешает вывод кастомного текста в футере
  hide:
    - attribution           # Скрывает заводскую надпись "Made with Material for MkDocs"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/progress.js

plugins:
  - search
  - i18n:
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
          link: /ru/
        - locale: en
          name: English
          default: false
          build: true
          link: /en/

markdown_extensions:
  - pymdownx.details
  - admonition
  - attr_list
  # Настройка расширенной подсветки кода и добавление кнопки «Скопировать»
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Блок ручной навигации, фиксирующий порядок разделов
nav:
  - index.md
  - commands.md
  - faq.md
  - vpn-setup.md
  - protocols.md
  - 3x-ui.md
  - server-management.md
  - hysteria2.md



