site_name: Amnezia Hosting Docs
site_url: https://bumbumshakataka1.github.io/hosting-docs/

# Ссылка на GitHub-репозиторий (добавляет иконку со звёздами в шапку сайта)
repo_name: bumbumshakataka1/hosting-docs
repo_url: https://github.com/bumbumshakataka1/hosting-docs

theme:
  name: material
  language: ru
  logo: assets/logo.png
  favicon: images/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  # Кастомная тёмная схема (все цвета задаются в extra.css) — гарантирует чёрный фон
  palette:
    - scheme: amnezia-dark
      primary: custom
      accent: custom
  features:
    - navigation.sections    # Группы разделов в боковом меню
    - navigation.expand      # Разделы развёрнуты по умолчанию
    - navigation.top         # Кнопка «Наверх» при скролле
    - navigation.tracking    # Обновляет URL при скролле до заголовков
    - navigation.footer      # Кнопки «Назад / Вперёд» внизу страницы
    - toc.follow             # Оглавление следует за прокруткой
    - content.code.copy      # Кнопка «Скопировать» на блоках кода
    - search.suggest         # Подсказки в поиске
    - search.highlight       # Подсветка найденного на странице

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/progress.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          build: true
          # Перевод названий разделов навигации на английский
          nav_translations:
            Начало работы: Getting Started
            VPN и защита: VPN & Security
            Помощь: Help

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html            # Разрешает разметку внутри HTML (нужно для «карточек» на главной)
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  # Расширенная подсветка кода + кнопка «Скопировать»
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true

# Блок ручной навигации, сгруппированный по разделам
nav:
  - index.md
  - Начало работы:
      - commands.md
      - server-management.md
  - VPN и защита:
      - vpn-setup.md
      - protocols.md
      - 3x-ui.md
      - hysteria2.md
  - Помощь:
      - faq.md

extra:
  generator: false          # Скрывает надпись «Made with Material for MkDocs»

